services:
  sender1:
    build: .
    container_name: multicast_sender1
    environment:
      - SENDER_ID=sender1
    command: python -u multicast_sender.py
    networks:
      - multicast_network

  sender2:
    build: .
    container_name: multicast_sender2
    environment:
      - SENDER_ID=sender2
    command: python -u multicast_sender.py
    networks:
      - multicast_network

  receiver1:
    build: .
    container_name: multicast_receiver1
    command: python -u multicast_receiver.py --duration 120
    depends_on:
      - sender1
      - sender2
    networks:
      - multicast_network

  receiver2:
    build: .
    container_name: multicast_receiver2
    command: python -u multicast_receiver.py --duration 150
    depends_on:
      - sender1
      - sender2
    networks:
      - multicast_network

networks:
  multicast_network:
    driver: bridge